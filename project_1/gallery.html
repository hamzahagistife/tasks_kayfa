<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gallery</title>
  </head>
  <body>
    <img
      width="200"
      height="200"
      src="./imags/Fortnite-week-9-loading-screen-wallpaper.jpg"
      alt="fortnite"
    />
    <img
      width="200"
      height="200"
      src="./imags/fortnite-x-prowler-c7.jpg
    "
      alt="fortnite x prowler"
    />
    <img
      width="200"
      height="200"
      src="./imags/generating-chakra-m1.jpg"
      alt="chakra"
    />

    <!-- لا يوجد اي معلومات في هذه الصورة لان الصورة ديكورية فقط لاتحمل معنى فيها -->
    <img width="150" height="150" src="./imags/decorative-pattern.png" alt="" />

    <figure>
      <img src="./imags/wallhaven-y86g17.jpg" alt="IT" />
      <figcaption>
        IT is a movie about a group of friends who are terrorized by a clown.
      </figcaption>
    </figure>

    <!-- عنا شيء اسمه srcset وهو يستخدم لتحديد الصورة المناسبة للشاشة المستخدمة -->
    <img
      src="https://placehold.co/800x600/png"
      srcset="
        https://placehold.co/600x400/png   600w,
        https://placehold.co/800x600/png   800w,
        https://placehold.co/1000x800/png 1000w
      "
      sizes="(max-width: 600px) 100vw, (max-width: 800px) 800px, 1000px"
      alt="IT"
    />

    <video
      width="600"
      src="./video/2024 Total Solar Eclipse_ Through the Eyes of NASA (Official Trailer)(1080P_HD).mp4"
      controls
      poster="./imags/fortnite-x-prowler-c7.jpg"
    ></video>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pricing page</title>
  </head>
  <body>
    <table border="1">
      <caption>
        Course Pricing Plans
      </caption>
      <thead>
        <tr>
          <th scope="col" rowspan="2">Plan</th>
          <th scope="col" colspan="2">Details</th>
        </tr>
        <tr>
          <th scope="col">Price per Month</th>
          <th scope="col">Features</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Basic</td>
          <td>$10</td>
          <td>Access to 3 courses</td>
        </tr>
        <tr>
          <td>Standard</td>
          <td>$20</td>
          <td>Access to 10 courses, Certificate</td>
        </tr>
        <tr>
          <td>Premium</td>
          <td>$35</td>
          <td>All courses, Certificate, 1-on-1 mentoring</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>

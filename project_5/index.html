<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Results summary component</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="card">
      <section class="result">
        <h1 class="result-title">Your Result</h1>
        <div class="score-circle">
          <p class="score-value">76</p>
          <p class="score-total">of 100</p>
        </div>
        <h2 class="result-rank">Great</h2>
        <p class="result-text">
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </section>

      <section class="summary">
        <h2 class="summary-title">Summary</h2>
        <ul class="stats" id="stats"></ul>
        <button class="continue-btn" type="button">Continue</button>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Hamza</a>.
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
